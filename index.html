<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A Garden of Wishes 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
/* ── Reset & base ─────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;overflow-x:hidden;background:#05010d;font-family:'DM Sans',sans-serif}

/* ── Canvas layers ────────────────────────────────────────────────────── */
canvas.bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
#c-nebula{z-index:0}
#c-stars {z-index:1}
#c-hearts{z-index:2}

/* ── Layout ───────────────────────────────────────────────────────────── */
.scene{position:relative;z-index:4;width:100%;max-width:980px;margin:0 auto}

/* ── Header ───────────────────────────────────────────────────────────── */
.header{text-align:center;padding:22px 0 0;z-index:5;position:relative;
  animation:fadedown .9s ease both}
@keyframes fadedown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.hdr-tag{font-size:9.5px;letter-spacing:5.5px;text-transform:uppercase;
  color:rgba(255,150,175,0.38);margin-bottom:7px}
.hdr-title{font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(20px,4vw,42px);color:rgba(255,215,230,0.92);font-weight:400;line-height:1.15}
.hdr-title em{color:rgba(255,100,145,0.82);font-style:italic}
.hdr-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:12px;
  color:rgba(255,160,185,0.3);margin-top:5px;letter-spacing:1.5px}

/* ── Garden ───────────────────────────────────────────────────────────── */
.garden{position:relative;width:100%;height:560px;margin-top:2px}
.garden svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bubbles-wrap{position:absolute;inset:0;pointer-events:none;z-index:12}

/* ── Bubble ───────────────────────────────────────────────────────────── */
.bbl{
  position:absolute;pointer-events:all;
  opacity:0;will-change:transform;
  transition:opacity 1.1s ease;
}
.bbl.visible{opacity:1}
.bbl-card{
  background:rgba(255,195,215,0.065);
  border:1px solid rgba(255,150,185,0.16);
  border-radius:18px 18px 18px 3px;
  padding:10px 13px 9px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 28px rgba(180,30,80,0.1),inset 0 1px 0 rgba(255,255,255,0.07);
  position:relative;max-width:190px;min-width:115px;
  transition:box-shadow .3s,border-color .3s;
}
.bbl-card:hover{
  box-shadow:0 6px 36px rgba(220,50,100,0.18),inset 0 1px 0 rgba(255,255,255,0.1);
  border-color:rgba(255,150,185,0.28);
}
.bbl-hrt{font-size:8px;color:rgba(255,110,145,0.55);letter-spacing:2px;margin-bottom:3px}
.bbl-msg{font-family:'Playfair Display',serif;font-style:italic;
  font-size:11px;line-height:1.7;color:rgba(255,228,238,0.9)}
.bbl-from{font-size:9px;color:rgba(255,140,170,0.48);margin-top:4px;
  text-align:right;letter-spacing:.2px}
.bbl-tail{position:absolute;bottom:-8px;left:13px;
  border:6px solid transparent;border-top:8px solid rgba(255,150,185,0.16)}
.bbl-del{
  position:absolute;top:-8px;right:-8px;
  width:20px;height:20px;border-radius:50%;
  background:rgba(20,5,15,0.88);border:1px solid rgba(255,80,120,0.32);
  color:rgba(255,100,130,0.75);font-size:11px;line-height:20px;text-align:center;
  cursor:pointer;display:none;transition:all .2s;z-index:3;
}
.bbl-card:hover .bbl-del{display:block}
.bbl-del:hover{background:rgba(180,20,60,0.92);color:#fff;border-color:rgba(255,80,120,0.6);transform:scale(1.12)}

/* ── Wish ribbon ──────────────────────────────────────────────────────── */
.wish-ribbon{
  position:fixed;bottom:55px;left:50%;transform:translateX(-50%);
  z-index:20;pointer-events:none;text-align:center;
  animation:ribfade 1s ease 3.5s both;
}
@keyframes ribfade{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.wish-text{font-family:'Playfair Display',serif;font-style:italic;
  font-size:12px;color:rgba(255,170,195,0.4);letter-spacing:2.5px}

/* ── Add button ───────────────────────────────────────────────────────── */
.add-btn{
  position:fixed;bottom:18px;right:18px;z-index:50;
  background:rgba(12,2,8,0.88);border:1px solid rgba(255,90,140,0.22);
  border-radius:40px;padding:9px 18px;
  color:rgba(255,205,220,0.88);font-family:'DM Sans',sans-serif;font-size:11px;
  cursor:pointer;display:flex;align-items:center;gap:7px;letter-spacing:.4px;
  backdrop-filter:blur(12px);transition:all .25s;
  box-shadow:0 4px 24px rgba(0,0,0,.55);
  animation:fadeup .8s ease 2.2s both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.add-btn:hover{transform:scale(1.05);border-color:rgba(255,90,140,.45);
  box-shadow:0 6px 32px rgba(200,40,90,.22)}

/* ── Overlay / Modal ──────────────────────────────────────────────────── */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(7px);z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.ov.open{opacity:1;pointer-events:all}
.modal{
  background:linear-gradient(155deg,#110320,#1c0412);
  border:1px solid rgba(255,90,140,.18);border-radius:22px;
  padding:28px;max-width:370px;width:92%;
  box-shadow:0 28px 80px rgba(0,0,0,.75);
  transform:translateY(24px) scale(.95);
  transition:transform .35s cubic-bezier(.34,1.6,.64,1);
}
.ov.open .modal{transform:translateY(0) scale(1)}
.modal-hrt{font-size:22px;margin-bottom:8px;display:inline-block;
  animation:hb 1.4s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.modal h2{font-family:'Playfair Display',serif;font-style:italic;
  color:rgba(255,220,232,.93);font-size:19px;font-weight:400;margin-bottom:3px}
.modal p.sub{font-size:10px;color:rgba(255,130,165,.42);letter-spacing:.5px}
.modal input,.modal textarea{
  width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,90,140,.1);border-radius:11px;
  color:rgba(255,220,232,.92);font-family:'Playfair Display',serif;font-style:italic;
  font-size:13px;outline:none;padding:9px 13px;margin-top:11px;resize:none;
  transition:border-color .2s;
}
.modal input:focus,.modal textarea:focus{border-color:rgba(255,90,140,.32)}
.modal-row{display:flex;gap:10px;margin-top:15px}
.btn-c{flex:1;padding:9px;border-radius:11px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);color:rgba(200,155,175,.6);
  cursor:pointer;font-size:11px;transition:.2s;font-family:'DM Sans',sans-serif}
.btn-c:hover{background:rgba(255,255,255,.06)}
.btn-s{flex:2;padding:9px;border-radius:11px;border:none;
  background:linear-gradient(135deg,#b91c5c,#7c0d35);
  color:rgba(255,215,228,.95);cursor:pointer;font-size:11px;font-weight:500;
  box-shadow:0 3px 18px rgba(160,15,70,.45);transition:all .2s;
  font-family:'DM Sans',sans-serif;letter-spacing:.3px}
.btn-s:hover{box-shadow:0 5px 26px rgba(160,15,70,.6)}
.btn-s:disabled{opacity:.5;cursor:not-allowed}
.modal-err{color:rgba(255,100,100,.75);font-size:10px;margin-top:6px;display:none}

/* ── Toast ────────────────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:62px;right:18px;z-index:200;
  background:#0e0318;border:1px solid rgba(255,100,140,.18);border-radius:12px;
  padding:9px 14px;font-size:11px;color:rgba(255,155,185,.8);
  pointer-events:none;opacity:0;transform:translateY(8px);transition:all .3s;
}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<!-- Background canvases -->
<canvas class="bg" id="c-nebula"></canvas>
<canvas class="bg" id="c-stars"></canvas>
<canvas class="bg" id="c-hearts"></canvas>

<div class="scene">
  <div class="header">
    <p class="hdr-tag">♥ with love, always ♥</p>
    <h1 class="hdr-title">a garden of <em>wishes</em></h1>
    <p class="hdr-sub">for the one who holds my heart</p>
  </div>

  <div class="garden">
    <svg id="svg" viewBox="0 0 980 560" preserveAspectRatio="xMidYMax meet">
      <defs>
        <filter id="fglow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="11" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="fsoft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="gg" cx="50%" cy="0%">
          <stop offset="0%"   stop-color="#3d1028" stop-opacity=".9"/>
          <stop offset="55%"  stop-color="#0e1a06" stop-opacity=".75"/>
          <stop offset="100%" stop-color="#030305" stop-opacity=".4"/>
        </radialGradient>
        <radialGradient id="moonwash" cx="50%" cy="0%">
          <stop offset="0%"   stop-color="rgba(255,200,220,0.05)"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <ellipse cx="490" cy="0"   rx="520" ry="280" fill="url(#moonwash)"/>
      <ellipse cx="490" cy="544" rx="510" ry="28"  fill="url(#gg)"/>
      <g id="g-grass"></g>
      <g id="g-flowers"></g>
    </svg>
    <div class="bubbles-wrap" id="bubbles-wrap"></div>
  </div>
</div>

<div class="wish-ribbon"><p class="wish-text">✦ make a wish ✦</p></div>

<button class="add-btn" onclick="openModal()">
  <span style="font-size:14px">♥</span> send a wish
</button>

<!-- Modal -->
<div class="ov" id="ov" onclick="ovClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hrt">♥</div>
    <h2>send a wish</h2>
    <p class="sub">whisper something only they would understand</p>
    <input  type="text" id="in-name" placeholder="your name (optional)…" maxlength="40"/>
    <textarea id="in-msg" rows="3" placeholder="your wish, your love, your secret…" maxlength="160"></textarea>
    <p class="modal-err" id="modal-err"></p>
    <div class="modal-row">
      <button class="btn-c" onclick="closeModal()">never mind</button>
      <button class="btn-s" id="btn-send" onclick="submitMsg()">♥ send wish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// CONFIG — swap these if you ever change Supabase project
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var SUPABASE_URL = 'https://ptbfjbivtjrrgcktldrt.supabase.co';
var SUPABASE_KEY = 'sb_publishable_AXWKtkCsHaxVjWpI4wAisg_7654K5_u';

});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// FALLBACK messages (shown when DB is empty or unreachable)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  {id:'f7',sender_name:'Anonymous',message_content:'You deserve a love as endless as the stars above us.'},
];

var SLOTS = [
  {lp:1, tp:3 },{lp:60,tp:2 },{lp:21,tp:13},{lp:74,tp:11},
  {lp:5, tp:30},{lp:52,tp:26},{lp:80,tp:27},
];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SEEDED RNG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function mkRng(seed){var s=seed;return function(){s=(s*16807)%2147483647;return(s-1)/2147483646};}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CANVAS 1 — NEBULA + STARS BG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
(function(){
  var cN=document.getElementById('c-nebula'),ctxN=cN.getContext('2d');
  var cS=document.getElementById('c-stars'), ctxS=cS.getContext('2d');
  var rng=mkRng(77);

  function resize(){
    cN.width=cS.width=innerWidth;
    cN.height=cS.height=innerHeight;
  }
  resize(); window.addEventListener('resize',resize);

  var blobs=Array.from({length:7},function(){return{
    x:rng(),y:rng()*.8,rx:.3+rng()*.35,ry:.2+rng()*.3,
    h:320+rng()*60,a:.025+rng()*.035,ph:rng()*Math.PI*2,sp:.0008+rng()*.0006
  }});
  var stars=Array.from({length:180},function(){return{
    x:rng(),y:rng()*.78,r:.3+rng()*1.4,
    op:.08+rng()*.55,ph:rng()*Math.PI*2,ps:.01+rng()*.018,h:300+rng()*80
  }});
  var petals=Array.from({length:22},function(){return{
    x:rng(),y:rng()*.7+.05,vy:-(0.00012+rng()*.00018),vx:(rng()-.5)*.00008,
    r:.8+rng()*2.2,op:.04+rng()*.14,ph:rng()*Math.PI*2,ps:.005+rng()*.008,h:330+rng()*40
  }});

  function drawNebula(){
    ctxN.clearRect(0,0,cN.width,cN.height);
    var bg=ctxN.createLinearGradient(0,0,0,cN.height);
    bg.addColorStop(0,'#04010c');bg.addColorStop(.5,'#070215');bg.addColorStop(1,'#060110');
    ctxN.fillStyle=bg;ctxN.fillRect(0,0,cN.width,cN.height);
    blobs.forEach(function(b){
      b.ph+=b.sp;
      var cx=b.x*cN.width,cy=b.y*cN.height;
      var rx=b.rx*cN.width,ry=b.ry*cN.height;
      var g=ctxN.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
      var alpha=b.a+Math.sin(b.ph)*.012;
      g.addColorStop(0,'hsla('+b.h+',65%,55%,'+alpha+')');
      g.addColorStop(.5,'hsla('+b.h+',50%,35%,'+(alpha*.4)+')');
      g.addColorStop(1,'transparent');
      ctxN.save();ctxN.scale(rx/ry,1);
      ctxN.fillStyle=g;ctxN.beginPath();ctxN.arc(cx*ry/rx,cy,ry,0,Math.PI*2);ctxN.fill();
      ctxN.restore();
    });
  }
  function drawStars(){
    ctxS.clearRect(0,0,cS.width,cS.height);
    stars.forEach(function(s){
      s.ph+=s.ps;
      var a=s.op*(.6+Math.sin(s.ph)*.4);
      ctxS.save();ctxS.globalAlpha=a;
      ctxS.shadowBlur=s.r*6;ctxS.shadowColor='hsl('+s.h+',70%,85%)';
      ctxS.fillStyle='hsl('+s.h+',60%,90%)';
      ctxS.beginPath();ctxS.arc(s.x*cS.width,s.y*cS.height,s.r,0,Math.PI*2);ctxS.fill();
      ctxS.restore();
    });
    petals.forEach(function(p){
      p.x+=p.vx+Math.sin(p.ph)*.00006;p.y+=p.vy;p.ph+=p.ps;
      if(p.y<-.04){p.y=.95+Math.random()*.08;p.x=Math.random();}
      var a=p.op+Math.sin(p.ph)*.03;
      ctxS.save();ctxS.globalAlpha=Math.max(0,a);
      ctxS.shadowBlur=p.r*10;ctxS.shadowColor='hsl('+p.h+',80%,70%)';
      ctxS.fillStyle='hsl('+p.h+',75%,78%)';
      ctxS.beginPath();ctxS.arc(p.x*cS.width,p.y*cS.height,p.r,0,Math.PI*2);ctxS.fill();
      ctxS.restore();
    });
  }
  function loop(){drawNebula();drawStars();requestAnimationFrame(loop);}
  loop();
})();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CANVAS 2 — FLOATING HEARTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
(function(){
  var c=document.getElementById('c-hearts'),ctx=c.getContext('2d');
  var rng=mkRng(33);
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  var hearts=Array.from({length:18},function(){return{
    x:rng(),y:.65+rng()*.38,vy:-(0.00016+rng()*.0002),vx:(rng()-.5)*.0001,
    sz:3.5+rng()*9,op:.035+rng()*.14,ph:rng()*Math.PI*2,
    ps:.007+rng()*.01,wb:rng()*.0025,hue:335+rng()*30
  }});
  function hrt(cx,cy,sz){
    var s=sz*.52;
    ctx.beginPath();ctx.moveTo(cx,cy+s*.28);
    ctx.bezierCurveTo(cx,cy-s*.55,cx-s*1.35,cy-s*.55,cx-s*1.35,cy);
    ctx.bezierCurveTo(cx-s*1.35,cy+s*.65,cx,cy+s*1.25,cx,cy+s*1.75);
    ctx.bezierCurveTo(cx,cy+s*1.25,cx+s*1.35,cy+s*.65,cx+s*1.35,cy);
    ctx.bezierCurveTo(cx+s*1.35,cy-s*.55,cx,cy-s*.55,cx,cy+s*.28);
    ctx.closePath();
  }
  function loop(){
    ctx.clearRect(0,0,c.width,c.height);

})();

// SVG HELPERS

var NS='http://www.w3.org/2000/svg';
function se(t){return document.createElementNS(NS,t);}
function sa(e,o){for(var k in o)e.setAttribute(k,o[k]);return e;}

// ── Maths helpers ───────────────────────────────────────────────────────────
function rad(d){return d*Math.PI/180;}
function ptOnBez(x0,y0,cx1,cy1,cx2,cy2,x1,y1,t){
  var m=1-t;
  return {
    x:m*m*m*x0+3*m*m*t*cx1+3*m*t*t*cx2+t*t*t*x1,
    y:m*m*m*y0+3*m*m*t*cy1+3*m*t*t*cy2+t*t*t*y1
  };
}
function bezLen(x0,y0,cx1,cy1,cx2,cy2,x1,y1,steps){
  steps=steps||60;
  var len=0,px=x0,py=y0;
  for(var i=1;i<=steps;i++){
    var p=ptOnBez(x0,y0,cx1,cy1,cx2,cy2,x1,y1,i/steps);
    var dx=p.x-px,dy=p.y-py;
    len+=Math.sqrt(dx*dx+dy*dy);
    px=p.x;py=p.y;
  }
  return Math.ceil(len)+2;
}

// ── Petal shape ─────────────────────────────────────────────────────────────
// Creates a realistic pointed-oval petal using two bezier arcs.
// cx,cy = center attachment, rx = half-width, ry = length, angle = direction
// pinch controls how cupped/pointed the tip is (0=round, 1=pointed)
function petalPath(cx,cy,rx,ry,angleDeg,pinch,twistL,twistR){
  var r=rad(angleDeg);
  var cos=Math.cos(r),sin=Math.sin(r);
  // tip point
  var tx=cx+ry*cos, ty=cy+ry*sin;
  // perpendicular (width direction)
  var px=-sin*rx, py=cos*rx;
  // control points — left arc bows outward, right arc slightly less
  var cp1Lx=cx+px*(1+twistL)+cos*ry*.35, cp1Ly=cy+py*(1+twistL)+sin*ry*.35;
  var cp2Lx=tx+px*(pinch||.5),           cp2Ly=ty+py*(pinch||.5);
  var cp1Rx=cx-px*(1+twistR)+cos*ry*.35, cp1Ry=cy-py*(1+twistR)+sin*ry*.35;
  var cp2Rx=tx-px*(pinch||.5),           cp2Ry=ty-py*(pinch||.5);
  return ['M',cx,cy,
    'C',cp1Lx,cp1Ly,cp2Lx,cp2Ly,tx,ty,
    'C',cp2Rx,cp2Ry,cp1Rx,cp1Ry,cx,cy].join(' ');
}

// ── Rose petal — cupped/rolled edge ─────────────────────────────────────────
function rosePetal(cx,cy,rx,ry,angleDeg,rollIn){
  var r=rad(angleDeg);
  var cos=Math.cos(r),sin=Math.sin(r);
  var tx=cx+ry*cos, ty=cy+ry*sin;
  var px=-sin*rx,py=cos*rx;
  var roll=rollIn||.3;
  // cup inward — left edge goes further, right pulls back creating cup effect
  return ['M',cx,cy,
    'C',cx+px*1.1+cos*ry*.28,cy+py*1.1+sin*ry*.28,
       tx+px*roll,ty+py*roll, tx,ty,
    'C',tx-px*(roll*.6),ty-py*(roll*.6),
       cx-px*.65+cos*ry*.42,cy-py*.65+sin*ry*.42,
       cx,cy].join(' ');
}

// ── Leaf shape ───────────────────────────────────────────────────────────────
function leafPath(cx,cy,angleDeg,len,wid,tipSharp){
  var r=rad(angleDeg);
  var cos=Math.cos(r),sin=Math.sin(r);
  var tx=cx+cos*len, ty=cy+sin*len;
  var px=-sin*wid,py=cos*wid;
  var ts=tipSharp||.55;
  return ['M',cx,cy,
    'C',cx+px*1.3+cos*len*.32,cy+py*1.3+sin*len*.32,
       tx+px*ts,ty+py*ts, tx,ty,
    'C',tx-px*(ts*.7),ty-py*(ts*.7),
       cx-px*.9+cos*len*.38,cy-py*.9+sin*len*.38,
       cx,cy].join(' ');
}

// ── SVG heart path ───────────────────────────────────────────────────────────
function heartPath(cx,cy,sz){
  var s=sz*.5;
  return ['M',cx,cy+s*.32,
    'C',cx,cy-s*.55,cx-s*1.35,cy-s*.55,cx-s*1.35,cy,
    'C',cx-s*1.35,cy+s*.7,cx,cy+s*1.3,cx,cy+s*1.82,
    'C',cx,cy+s*1.3,cx+s*1.35,cy+s*.7,cx+s*1.35,cy,
    'C',cx+s*1.35,cy-s*.55,cx,cy-s*.55,cx,cy+s*.32,'Z'].join(' ');
}

// FLOWERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Each flower: x=base x, by=ground y, h=stem height, lean=tip x offset

// pc=petal main, pc2=petal dark, pc3=petal light, cc=center color
// lh=leaf hue, sc=size scale, sd=stagger delay (seconds)
var FLOWERS=[
  {x:90,  by:528,h:220,lean:-28,pN:8, type:'daisy', pc:'#f9a8d4',pc2:'#be185d',pc3:'#fce7f3',cc:'#fef08a',lh:134,sc:1.0,  sd:0   },

  {x:335, by:528,h:260,lean:-12,pN:12,type:'daisy', pc:'#f472b6',pc2:'#9d174d',pc3:'#fdf2f8',cc:'#fef9c3',lh:130,sc:1.05, sd:1.1 },
  {x:460, by:528,h:310,lean:25, pN:6, type:'rose',  pc:'#e879f9',pc2:'#7e22ce',pc3:'#fae8ff',cc:'#fde68a',lh:128,sc:1.25, sd:.35 },

  {x:810, by:528,h:250,lean:-22,pN:10,type:'daisy', pc:'#f9a8d4',pc2:'#831843',pc3:'#fdf2f8',cc:'#fde68a',lh:133,sc:1.02, sd:.7  },
  {x:920, by:528,h:268,lean:10, pN:6, type:'rose',  pc:'#fca5a5',pc2:'#991b1b',pc3:'#fff1f2',cc:'#fde68a',lh:126,sc:1.08, sd:1.2 },
];

var svgDefs=document.querySelector('#svg defs');

FLOWERS.forEach(function(f,fi){

    stops.forEach(function(s){
      var st=se('stop');st.setAttribute('offset',s[0]);st.setAttribute('stop-color',s[1]);g.appendChild(st);

  // Petal gradient: light at base, saturated at mid, dark at tip

    ['0%',f.pc3],['40%',f.pc],['100%',f.pc2]

    ['0%',f.pc],['100%',f.pc2]
  ]);
  // Center disc
  mkRG('cg'+fi,{cx:'38%',cy:'32%',r:'65%'},[
    ['0%','#fffde7'],['42%',f.cc],['100%','#92400e']
  ]);
  // Stem (vertical, dark at root, bright mid, slightly lighter tip)
  mkLG('sg'+fi,'0','0','0','1',[
    ['0%','hsl('+f.lh+',42%,10%)'],
    ['35%','hsl('+f.lh+',55%,26%)'],
    ['100%','hsl('+f.lh+',60%,40%)']
  ]);
  // Leaf
  mkLG('lg'+fi,'0','0','1','0',[
    ['0%','hsl('+f.lh+',60%,48%)'],
    ['55%','hsl('+f.lh+',52%,30%)'],
    ['100%','hsl('+f.lh+',44%,16%)']
  ]);
  // Sepal
  mkLG('sep'+fi,'0','0','1','1',[
    ['0%','hsl('+f.lh+',55%,32%)'],
    ['100%','hsl('+f.lh+',42%,18%)']
  ]);

  // ── Geometry ────────────────────────────────────────────────────────────
  var tipX=f.x+f.lean, tipY=f.by-f.h;
  var midY=(f.by+tipY)/2;
  // Stem bezier control points — natural S-curve
  var cp1x=f.x+f.lean*.15, cp1y=midY+50;

  var stemD='M '+f.x+' '+f.by+' C '+cp1x+' '+cp1y+','+cp2x+' '+cp2y+','+tipX+' '+tipY;

  // Measure stem length for dash animation
  var sl=bezLen(f.x,f.by,cp1x,cp1y,cp2x,cp2y,tipX,tipY);

  // ── Timing ──────────────────────────────────────────────────────────────
  var T=f.sd*.22;          // per-flower start offset

  var headT=T+stemT*.88;   // head appears as stem finishes
  var swayT=T+stemT+1.0;   // sway starts after fully settled

  var swayAmp=(4.5+Math.abs(f.lean)*.14).toFixed(1)+'deg';

  // ── Root group — carries idle sway after grow ────────────────────────
  var root=se('g');
  root.style.cssText='transform-origin:'+f.x+'px '+f.by+'px;--sa:'+swayAmp+';animation:sway '+swayDur+'s ease-in-out infinite '+swayT+'s';
  document.getElementById('g-flowers').appendChild(root);

  // ── STEM — 3 layers for depth ────────────────────────────────────────

      var tdx=pt2.x-pt.x, tdy=pt2.y-pt.y;
      var tn=Math.sqrt(tdx*tdx+tdy*tdy);
      // perpendicular
      var side=(ti2%2===0)?1:-1;

      var tLen=8*S;
      var thorn=se('path');
      sa(thorn,{d:'M '+pt.x+' '+pt.y+' Q '+(pt.x+nx*tLen*.6+tdx/tn*tLen*.4)+' '+(pt.y+ny*tLen*.6+tdy/tn*tLen*.4)+' '+(pt.x+nx*tLen)+' '+(pt.y+ny*tLen),

    {t:.52, ang:136, len:46*S, wid:12*S},
    {t:.41, ang:-30, len:36*S, wid:10*S},
  ];
  leafDefs.forEach(function(ld,li){
    var pt=ptOnBez(f.x,f.by,cp1x,cp1y,cp2x,cp2y,tipX,tipY,ld.t);

      fill:'none',stroke:'rgba(255,255,255,.14)','stroke-width':.7,opacity:0});

    [.28,.52,.72].forEach(function(vt){
      var vx=pt.x+Math.cos(vr)*ld.len*vt, vy=pt.y+Math.sin(vr)*ld.len*vt;
      [-1,1].forEach(function(side2){
        var sva=ld.ang+side2*52;
        var sv=se('path');
        sa(sv,{d:'M '+vx+' '+vy+' L '+(vx+Math.cos(rad(sva))*ld.wid*.65)+' '+(vy+Math.sin(rad(sva))*ld.wid*.65),
          fill:'none',stroke:'rgba(255,255,255,.07)','stroke-width':.45,opacity:0});

        root.appendChild(sv);
      });
    });
  });

  // ── SEPALS — green pointed petals at flower base ─────────────────────
  var sepalCount=(f.type==='tulip')?5:4;
  var sepalLen=22*S, sepalWid=6*S;

  for(var i=0;i<sepalCount;i++){
    var sang=(360/sepalCount)*i-90;
    var sep2=se('path');
    sa(sep2,{d:petalPath(tipX,tipY+2,sepalWid,sepalLen,sang,.3,.1,.1),
      fill:'url(#sep'+fi+')','stroke-width':0,opacity:.9});
    sepalGroup.appendChild(sep2);
  }
  root.appendChild(sepalGroup);

  // ── FLOWER HEAD ──────────────────────────────────────────────────────
  var head=se('g');
  head.style.cssText='transform-origin:'+tipX+'px '+tipY+'px;opacity:0;animation:headPop .7s cubic-bezier(.34,1.6,.64,1) forwards '+headT+'s';
  root.appendChild(head);

  // Drop shadow beneath head
  var sh=se('ellipse');
  sa(sh,{cx:tipX+f.lean*.2,cy:tipY+20,rx:30*S,ry:8*S,fill:'rgba(0,0,0,.16)',filter:'url(#fglow)'});
  head.appendChild(sh);

  // Ambient glow (3 halos, decreasing radius)
  [[.038,80],[.058,60],[.088,42]].forEach(function(gl){
    var gc=se('circle');sa(gc,{cx:tipX,cy:tipY,r:gl[1]*S,fill:f.pc,opacity:gl[0],filter:'url(#fglow)'});head.appendChild(gc);
  });

  // ── PETAL LAYERS ─────────────────────────────────────────────────────
  if(f.type==='daisy'){
    // Daisy: long thin petals radiating from center, 2 rings
    var outerLen=52*S, outerWid=9*S;
    var innerLen=40*S, innerWid=7*S;

    // Outer ring — primary petals
    for(var i=0;i<f.pN;i++){
      var ang=(360/f.pN)*i-90;
      // Slight length variation for natural look
      var lVar=1+Math.sin(i*1.7)*.1;
      var wVar=1+Math.cos(i*2.3)*.08;
      var op=se('path');
      sa(op,{d:petalPath(tipX,tipY,outerWid*wVar,outerLen*lVar,ang,.25,
          i%3===0?.15:.05, i%3===1?.12:.04),
        fill:'url(#pg'+fi+')',stroke:f.pc2,'stroke-width':.6,opacity:0});
      op.style.cssText='transform-origin:'+tipX+'px '+tipY+'px;animation:petalOpen .5s cubic-bezier(.34,1.6,.64,1) forwards '+(headT+.06+i*(0.045))+'s';
      head.appendChild(op);
    }
    // Inner ring — shorter, offset by half step
    for(var i=0;i<f.pN;i++){
      var ang2=(360/f.pN)*i-90+180/f.pN;
      var ip=se('path');
      sa(ip,{d:petalPath(tipX,tipY,innerWid*.82,innerLen*.78,ang2,.3,.06,.04),
        fill:'url(#pu'+fi+')',opacity:0});
      ip.style.cssText='transform-origin:'+tipX+'px '+tipY+'px;animation:petalOpen .45s cubic-bezier(.34,1.5,.64,1) forwards '+(headT+.22+i*.04)+'s';
      head.appendChild(ip);
    }

  } else if(f.type==='rose'){
    // Rose: tightly spiraled cupped petals — 4 rings getting smaller inward
    var rRings=[
      {n:f.pN,   len:50*S, wid:18*S, roll:.45, offset:0  },
      {n:f.pN,   len:40*S, wid:15*S, roll:.55, offset:20 },
      {n:f.pN-1, len:30*S, wid:12*S, roll:.65, offset:40 },
      {n:f.pN-2, len:20*S, wid:9*S,  roll:.75, offset:55 },
    ];
    rRings.forEach(function(ring,ri){
      for(var i=0;i<ring.n;i++){
        var ang=(360/ring.n)*i-90+ring.offset;
        var rp=se('path');
        sa(rp,{d:rosePetal(tipX,tipY,ring.wid,ring.len,ang,ring.roll),
          fill:'url(#pg'+fi+')',stroke:f.pc2,'stroke-width':.5,opacity:0});
        rp.style.cssText='transform-origin:'+tipX+'px '+tipY+'px;animation:petalOpen '+(0.5-.04*ri)+'s cubic-bezier(.34,1.5,.64,1) forwards '+(headT+.05+ri*.18+i*.05)+'s';
        head.appendChild(rp);
      }
    });

  } else if(f.type==='tulip'){
    // Tulip: 6 large cupped petals, 2 whorls of 3
    // Outer whorl — 3 petals, wide & cupped
    var tLen=68*S, tWid=22*S;
    for(var i=0;i<3;i++){
      var ang=(360/3)*i-90;
      var tp2=se('path');
      // tulip petal has strong upward cup — sides fold forward
      sa(tp2,{d:rosePetal(tipX,tipY,tWid,tLen,ang,.7),
        fill:'url(#pg'+fi+')',stroke:f.pc2,'stroke-width':.6,opacity:0});
      tp2.style.cssText='transform-origin:'+tipX+'px '+tipY+'px;animation:petalOpen .6s cubic-bezier(.34,1.7,.64,1) forwards '+(headT+.04+i*.08)+'s';
      head.appendChild(tp2);
    }
    // Inner whorl — 3 petals offset 60°, slightly narrower
    for(var i=0;i<3;i++){
      var ang2=(360/3)*i-90+60;
      var tp3=se('path');
      sa(tp3,{d:rosePetal(tipX,tipY,tWid*.88,tLen*.92,ang2,.62),
        fill:'url(#pu'+fi+')',opacity:0});
      tp3.style.cssText='transform-origin:'+tipX+'px '+tipY+'px;animation:petalOpen .55s cubic-bezier(.34,1.65,.64,1) forwards '+(headT+.18+i*.07)+'s';
      head.appendChild(tp3);
    }
    // Petal edge highlight lines (tulip veins run to tip)
    for(var i=0;i<6;i++){
      var va=(360/6)*i-90;
      var vlen=tLen*.72;
      var vx2=tipX+Math.cos(rad(va))*vlen, vy2=tipY+Math.sin(rad(va))*vlen;
      var vl=se('line');
      sa(vl,{x1:tipX,y1:tipY,x2:vx2,y2:vy2,
        stroke:'rgba(255,255,255,.1)','stroke-width':.8,opacity:0});
      vl.style.cssText='animation:headPop .4s ease forwards '+(headT+.32+i*.04)+'s';
      head.appendChild(vl);
    }
  }

  // ── CENTER DISC ───────────────────────────────────────────────────────
  var discR=(f.type==='daisy')?18*S:14*S;
  // Outer ring (slightly darker rim)
  var discRim=se('circle');
  sa(discRim,{cx:tipX,cy:tipY,r:discR+2.5*S,fill:f.cc,opacity:.5});
  head.appendChild(discRim);
  // Main disc
  var disc=se('circle');
  sa(disc,{cx:tipX,cy:tipY,r:discR,fill:'url(#cg'+fi+')'});
  head.appendChild(disc);

  // Stamens (filaments + anther tips, 16 for daisy, 12 for rose/tulip)
  var stamN=(f.type==='daisy')?16:12;
  var stamInner=discR*.38, stamOuter=discR*.9;
  for(var i=0;i<stamN;i++){
    var sa4=i/stamN*Math.PI*2;
    // Filament
    var fil=se('line');
    sa(fil,{x1:tipX+Math.cos(sa4)*stamInner*S,y1:tipY+Math.sin(sa4)*stamInner*S,
      x2:tipX+Math.cos(sa4)*stamOuter*S,y2:tipY+Math.sin(sa4)*stamOuter*S,
      stroke:'rgba(120,65,0,.5)','stroke-width':.9});
    head.appendChild(fil);
    // Anther (teardrop shape aligned to filament direction)
    var ax=tipX+Math.cos(sa4)*(stamOuter+2.2)*S;
    var ay=tipY+Math.sin(sa4)*(stamOuter+2.2)*S;
    var ant=se('ellipse');
    sa(ant,{cx:ax,cy:ay,rx:1.8*S,ry:1.2*S,
      transform:'rotate('+(i/stamN*360)+','+ax+','+ay+')',
      fill:'rgba(245,180,30,.82)'});
    head.appendChild(ant);
  }
  // Pollen dots
  for(var i=0;i<18;i++){
    var pa=i/18*Math.PI*2;
    var pr=discR*.52*S;
    var pd2=se('circle');
    sa(pd2,{cx:tipX+Math.cos(pa)*pr,cy:tipY+Math.sin(pa)*pr,r:1.5*S,fill:'rgba(255,228,50,.6)'});
    head.appendChild(pd2);
  }
  // Pistil (central dome)
  var pist=se('circle');sa(pist,{cx:tipX,cy:tipY,r:6*S,fill:'rgba(255,252,195,.96)'});head.appendChild(pist);
  var pistShine=se('ellipse');
  sa(pistShine,{cx:tipX-2*S,cy:tipY-2*S,rx:3*S,ry:2*S,fill:'rgba(255,255,255,.65)',transform:'rotate(-35,'+tipX+','+tipY+')'});
  head.appendChild(pistShine);
  // Stigma tips (3 lobes)
  for(var i=0;i<3;i++){
    var sta=i/3*Math.PI*2-Math.PI/6;
    var stx=tipX+Math.cos(sta)*4*S, sty=tipY+Math.sin(sta)*4*S;
    var stigma=se('circle');sa(stigma,{cx:stx,cy:sty,r:1.6*S,fill:'rgba(255,255,180,.9)'});head.appendChild(stigma);
  }

  // ── FLOATING HEART ───────────────────────────────────────────────────
  var hg=se('g');
  var hgDelay=headT+1.2;
  var hgDur=(2.5+fi*.38).toFixed(2);
  hg.style.cssText='opacity:0;animation:headPop .5s ease forwards '+hgDelay+'s, heartPulse '+hgDur+'s ease-in-out infinite '+(hgDelay+.6)+'s';
  var hp=se('path');sa(hp,{d:heartPath(tipX,tipY,10*S),fill:f.pc,opacity:.55,filter:'url(#fglow)'});hg.appendChild(hp);
  var hp2=se('path');sa(hp2,{d:heartPath(tipX-S,tipY-S,5*S),fill:'rgba(255,255,255,.5)',opacity:.4});hg.appendChild(hp2);
  head.appendChild(hg);
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MESSAGES — Supabase-backed, with live fallback
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var DB = []; // stays empty until Supabase responds; fallback only on network failure
var bWrap = document.getElementById('bubbles-wrap');
var bEls  = new Array(SLOTS.length).fill(null);
var bPhys = SLOTS.map(function(){
  return {y:0,vy:0,dx:0,dvx:0,
    ph:Math.random()*Math.PI*2,freq:.22+Math.random()*.14,amp:5+Math.random()*7,
    dph:Math.random()*Math.PI*2,df:.07+Math.random()*.06,da:2+Math.random()*4};
});

function buildBubble(slotIdx, msgObj){
  var slot = SLOTS[slotIdx];
  var wrap = document.createElement('div');
  wrap.className = 'bbl';
  wrap.style.left = slot.lp + '%';
  wrap.style.top  = slot.tp + '%';

  var card = document.createElement('div');
  card.className = 'bbl-card';

  var hrt = document.createElement('div');
  hrt.className = 'bbl-hrt';
  hrt.textContent = '♥';

  var msg = document.createElement('div');
  msg.className = 'bbl-msg';
  msg.textContent = msgObj.message_content;

  var from = document.createElement('div');
  from.className = 'bbl-from';
  from.textContent = '— ' + (msgObj.sender_name || 'Anonymous');

  var tail = document.createElement('div');
  tail.className = 'bbl-tail';

  var del = document.createElement('div');
  del.className = 'bbl-del';
  del.textContent = '×';
  del.title = 'remove this wish';
  del.onclick = function(e){
    e.stopPropagation();
    handleDelete(msgObj.id, slotIdx, wrap);
  };

  card.appendChild(hrt);
  card.appendChild(msg);
  card.appendChild(from);
  card.appendChild(tail);
  card.appendChild(del);
  wrap.appendChild(card);
  bWrap.appendChild(wrap);

  // fade in
  setTimeout(function(){ wrap.classList.add('visible'); }, 350 + slotIdx * 240);
  return wrap;
}

function renderSlot(slotIdx){
  var old = bEls[slotIdx];
  if(old){ old.style.opacity='0'; old.style.transform='scale(0.88)'; setTimeout(function(){if(old.parentNode)old.remove();},700); }
  // If DB is empty after a delete, show nothing — don't recycle fallback
  if(DB.length === 0){ bEls[slotIdx]=null; return; }
  var msgObj = DB[slotIdx % DB.length];
  bEls[slotIdx] = buildBubble(slotIdx, msgObj);
}

function initBubbles(){
  SLOTS.forEach(function(_,i){ renderSlot(i); });
}

// physics loop — smooth spring floats, direct DOM, no React
(function loop(ts){
  var now = ts/1000;
  bEls.forEach(function(el,i){
    if(!el||!el.parentNode) return;
    var p = bPhys[i];
    var ty  = Math.sin(now*p.freq*Math.PI*2+p.ph)*p.amp;
    var tdx = Math.sin(now*p.df*Math.PI*2+p.dph)*p.da;
    p.vy  += (ty -p.y )*0.076; p.vy  *= 0.70; p.y  += p.vy;
    p.dvx += (tdx-p.dx)*0.055; p.dvx *= 0.74; p.dx += p.dvx;
    el.style.transform = 'translate('+p.dx.toFixed(2)+'px,'+p.y.toFixed(2)+'px)';
  });
  requestAnimationFrame(loop);
})(0);

// ── Supabase: fetch + realtime ─────────────────────────────────────────────
async function loadMessages(){
  try{
    var res = await sb.from('messages').select('id,sender_name,message_content,created_at').order('created_at',{ascending:false}).limit(20);
    if(res.error) throw res.error;
    // Always trust Supabase result — empty array = user cleared everything, don't re-show fallback
    DB = res.data || [];
  } catch(e){
    // Only use built-in fallback if Supabase is truly unreachable
    DB = FALLBACK.slice();
  }
  initBubbles();
}

function subscribeRealtime(){
  sb.channel('messages-rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
      DB.unshift(payload.new);
      if(DB.length>20) DB.length=20;
      // push into first slot smoothly
      var old=bEls[0];
      if(old){old.style.opacity='0';setTimeout(function(){if(old.parentNode)old.remove();bEls[0]=buildBubble(0,DB[0]);},700);}
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},function(payload){
      DB = DB.filter(function(m){return m.id !== payload.old.id;});
      // refresh all slots
      SLOTS.forEach(function(_,i){
        var cur=bEls[i];
        if(cur){ var newMsg=DB[i%Math.max(DB.length,1)]; if(cur.querySelector('.bbl-msg').textContent !== newMsg.message_content){ renderSlot(i); } }
      });
    })
    .subscribe();
}

loadMessages().then(subscribeRealtime);

// ── Delete ─────────────────────────────────────────────────────────────────
async function handleDelete(id, slotIdx, wrapEl){
  // optimistic
  wrapEl.style.opacity='0';wrapEl.style.transform+=' scale(0.88)';
  DB = DB.filter(function(m){return m.id!==id;});
  showToast('✕ wish released');
  setTimeout(function(){if(wrapEl.parentNode)wrapEl.remove();renderSlot(slotIdx);},700);
  try{ await sb.from('messages').delete().eq('id',id); }
  catch(e){ /* realtime will reconcile */ }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MODAL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openModal(){ document.getElementById('ov').classList.add('open'); }
function closeModal(){ document.getElementById('ov').classList.remove('open'); document.getElementById('modal-err').style.display='none'; }
function ovClick(e){ if(e.target===document.getElementById('ov')) closeModal(); }

async function submitMsg(){
  var name = document.getElementById('in-name').value.trim();
  var msg  = document.getElementById('in-msg').value.trim();
  var err  = document.getElementById('modal-err');
  var btn  = document.getElementById('btn-send');

  if(!msg){ err.textContent='Please write something beautiful first ♥'; err.style.display='block'; return; }
  err.style.display='none';
  btn.disabled=true; btn.textContent='sending…';

  var senderName = name || 'Anonymous';

  try{
    var res = await sb.from('messages').insert([{sender_name:senderName, message_content:msg}]).select().single();
    if(res.data){
      DB.unshift(res.data);
      if(DB.length>20) DB.length=20;
      renderSlot(0); // push into slot 0
    }
    document.getElementById('in-name').value='';
    document.getElementById('in-msg').value='';
    closeModal();
    showToast('♥ wish added to the garden');
  } catch(e){
    err.textContent='Could not save — check Supabase connection.';
    err.style.display='block';
  }

  btn.disabled=false; btn.textContent='♥ send wish';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
var toastTimer;
function showToast(txt){
  var t=document.getElementById('toast');
  t.textContent=txt; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2800);
}

// allow Enter in textarea via Ctrl+Enter
document.getElementById('in-msg').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) submitMsg();
});
</script>
